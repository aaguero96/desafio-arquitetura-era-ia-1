# Edge: a borda, o proxy reverso da empresa. Não altere este arquivo.
# É a porta de entrada oficial do helpdesk em http://localhost:8000.

server {
    listen 80;

    # O DNS interno do Docker resolve o nome "app" em tempo de requisição.
    # Enquanto não existir um serviço "app" no compose, a borda responde 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://app:8080;

    location / {
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Paciência da borda: se o upstream passar 30 segundos sem enviar
        # nenhum byte, a requisição é encerrada com 504.
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;

    }
}
